name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.1', '3.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Verify bundled libraries and notices
        run: python3 scripts/check-native.py
      - name: Test the packaged runtime
        run: ruby -Ilib:test test/vastlint_test.rb
      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build vastlint.gemspec --output pkg/vastlint-check.gem
