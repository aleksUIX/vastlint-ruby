name: Publish Ruby Gem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601  # v1.315.0
        with:
          ruby-version: '3.3'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Derive version and upstream release tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="$(ruby -Ilib -e 'require "vastlint/version"; print Vastlint::VERSION')"
            TAG="v${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Vendor release libraries
        run: ./scripts/fetch-libs.sh "${{ steps.version.outputs.tag }}"

      - name: Run tests
        run: ruby -Ilib:test test/vastlint_test.rb

      - name: Build gem
        run: gem build vastlint.gemspec

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PACKAGES_OWNER: ${{ github.repository_owner }}
        run: |
          out=$(./scripts/publish-github-packages.sh 2>&1) && echo "$out" && exit 0
          echo "$out"
          echo "$out" | grep -qiE "repushing of gem versions is not allowed|already been taken" && exit 0
          exit 1